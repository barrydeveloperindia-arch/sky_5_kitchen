<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Sky 5 - Special Thali Poster</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .poster {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border: 20px solid #d4af37;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }
        .image-container {
            width: 100%;
            height: 60%;
            background: url('https://images.unsplash.com/photo-1589302168068-964664d93dc0?q=80&w=1080&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        .content {
            padding: 40px;
            text-align: center;
        }
        .title {
            font-family: 'Cinzel', serif;
            font-size: 80px;
            color: #d4af37;
            margin-bottom: 20px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .price-tag {
            font-size: 140px;
            font-weight: 700;
            color: #ff9933;
            margin: 20px 0;
            line-height: 1;
        }
        .price-label {
            font-size: 40px;
            color: #fff;
            vertical-align: super;
            margin-right: 10px;
        }
        .desc {
            font-size: 32px;
            color: #f1e5ac;
            letter-spacing: 2px;
        }
        .footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            color: #d4af37;
            border-top: 2px solid #333;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="image-container"></div>
        <div class="content">
            <div class="title">SPECIAL VEG THALI</div>
            <div class="price-tag"><span class="price-label">ONLY</span>₹240</div>
            <div class="desc">A Complete Heart-Warming Meal</div>
        </div>
        <div class="footer">
            📍 Disha Arcade, IT Park Road | 📞 081464 07934
        </div>
    </div>
</body>
</html>
