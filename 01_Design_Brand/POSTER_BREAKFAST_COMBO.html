<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Sky 5 - Breakfast Combo Poster</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .poster {
            width: 1080px;
            height: 1080px;
            background: #fff;
            border: 20px solid #d4af37;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #0a0a0a;
        }
        .image-container {
            width: 100%;
            height: 60%;
            background: url('https://images.unsplash.com/photo-1617460528436-16e6d764cf6e?q=80&w=1080&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .content {
            padding: 40px;
            text-align: center;
        }
        .title {
            font-family: 'Cinzel', serif;
            font-size: 80px;
            color: #0a0a0a;
            margin-bottom: 10px;
        }
        .price-tag {
            background: #0a0a0a;
            color: #d4af37;
            font-size: 100px;
            font-weight: 700;
            display: inline-block;
            padding: 10px 40px;
            border-radius: 60px;
            margin: 20px 0;
        }
        .desc {
            font-size: 32px;
            color: #666;
            font-weight: 600;
        }
        .highlight { color: #24963f; }
        .footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            color: #666;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="image-container"></div>
        <div class="content">
            <div class="title">EARLY BIRD COMBO</div>
            <div class="desc">2 Aloo Paratha + Hot Masala Tea</div>
            <div class="price-tag">₹129</div>
            <div class="desc"><span class="highlight">🟢 100% PURE VEGETARIAN</span></div>
        </div>
        <div class="footer">
            📍 IT Park Rd, Panchkula | 🏠 Hotel Sky 5
        </div>
    </div>
</body>
</html>
